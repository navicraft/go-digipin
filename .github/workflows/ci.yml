name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.21", "1.22", "1.23", "1.24"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Enforce 100% coverage
        run: |
          go tool cover -func=coverage.out
          UNCOVERED=$(go tool cover -func=coverage.out | grep -v '100.0%' | grep -v '^total:' || true)
          if [ -n "$UNCOVERED" ]; then
            echo "Coverage is below 100%:"
            echo "$UNCOVERED"
            exit 1
          fi
          echo "Coverage is 100.0%"

      - name: Fuzz smoke test
        if: matrix.go-version == '1.24'
        run: |
          go test -run=^$ -fuzz=FuzzEncodeDecodeRoundTrip -fuzztime=20s .
          go test -run=^$ -fuzz=FuzzDecode -fuzztime=20s .

      - name: Check formatting and vet
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted:"
            gofmt -s -l .
            exit 1
          fi
          go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: golangci-lint
        # Pinned to the version the .golangci.yml schema targets (v1). Using
        # "latest" would install golangci-lint v2, whose config format differs.
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
