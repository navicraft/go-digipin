name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # re-run by hand: gh workflow run ci.yml

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The go.mod minimum (keep in sync with go.mod) and the latest release.
        go-version: ["1.24.x", stable]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out ./...

      - name: Enforce 100% coverage
        shell: bash # adds -o pipefail, so a go tool cover failure fails the step
        run: |
          UNCOVERED=$(go tool cover -func=coverage.out | grep -v '100.0%' || true)
          if [ -n "$UNCOVERED" ]; then
            echo "Coverage is below 100%:"
            echo "$UNCOVERED"
            exit 1
          fi
          echo "Coverage is 100.0%"

      - name: Fuzz smoke test
        if: matrix.go-version == 'stable'
        run: |
          go test -run='^$' -fuzz=FuzzEncodeDecodeRoundTrip -fuzztime=20s .
          go test -run='^$' -fuzz=FuzzDecode -fuzztime=20s .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Runs gofmt and govet too (see .golangci.yml).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
