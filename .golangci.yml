version: "2"

linters:
  # The "standard" set (errcheck, govet, ineffassign, staticcheck, unused) is
  # enabled by default; these are added on top.
  enable:
    - goconst
    - gocyclo
    - misspell
    - prealloc
    - revive
    - unconvert
  settings:
    gocyclo:
      min-complexity: 15
    misspell:
      locale: US
  exclusions:
    # The exclusions golangci-lint v1 applied by default.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Table-driven tests and example outputs are intentionally verbose.
      - path: _test\.go
        linters:
          - goconst
          - gocyclo

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
